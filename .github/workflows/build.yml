name: Build/release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
        arch: [arm64]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Lib
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libxrender-dev libxmu-dev libxmuu-dev rpm

      - name: ${{ matrix.os }} ${{ matrix.arch }} build
        env:
          M_ARCH: ${{matrix.arch}}
          USE_HARD_LINKS: false
        run: |
          npm install -g pnpm@10.0.0
          pnpm install
          pnpm run dist

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eSearch-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/*.AppImage
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.snap
            build/*.zip
            build/*.exe
            build/*.dmg
          if-no-files-found: ignore
          retention-days: 7

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "build/*"
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
